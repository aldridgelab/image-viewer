[project]
name = "image-viewer"
version = "1.0.0"
description = "Standalone TIFF channel image viewer for Aldridge multiomics data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.124.4",
    "imagecodecs>=2025.11.11",
    "numpy>=2.3.5",
    "pillow>=12.0.0",
    "pydantic>=2.0",
    "pywebview>=6.2.1",
    "tifffile>=2025.12.12",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
